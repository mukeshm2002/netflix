<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Netflix Core Theme Styling */
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Navbar Customization */
        .navbar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            transition: background-color 0.5s ease;
            z-index: 1000;
        }
        .navbar.scrolled {
            background-color: #141414 !important;
        }
        .navbar-brand {
            color: #E50914 !important;
            font-weight: bold;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .nav-link {
            color: #e5e5e5 !important;
            font-size: 0.9rem;
            margin-right: 15px;
        }
        .nav-link:hover {
            color: #b3b3b3 !important;
        }

        /* Hero Billboard Banner */
        .billboard {
            position: relative;
            height: 85vh;
            background-size: cover;
            background-position: center center;
            display: flex;
            align-items: center;
            margin-bottom: -50px;
        }
        .billboard-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(74deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0) 100%),
                        linear-gradient(to top, #141414 0%, rgba(20,20,20,0) 15%);
        }
        .billboard-content {
            position: relative;
            z-index: 2;
            max-width: 40%;
            margin-left: 4%;
        }
        .billboard-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .billboard-desc {
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        /* Netflix Movie Row Slider */
        .movie-row {
            padding: 0 4% 20px 4%;
            position: relative;
            z-index: 3;
        }
        .row-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #e5e5e5;
            margin-bottom: 10px;
        }
        .movie-slider {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scrollbar-width: none; /* Hide scrollbar for Firefox */
        }
        .movie-slider::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome/Safari */
        }
        .movie-card {
            min-width: 240px;
            max-width: 240px;
            height: 135px;
            background-color: #181818;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .movie-card:hover {
            transform: scale(1.08);
            z-index: 10;
        }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-card-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .movie-card:hover .movie-card-overlay {
            opacity: 1;
        }

        /* Standard Buttons */
        .btn-play {
            background-color: #fff;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
        }
        .btn-play:hover { background-color: #e6e6e6; color: #000; }
        .btn-info-custom {
            background-color: rgba(109, 109, 110, 0.7);
            color: #fff;
            font-weight: bold;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
        }
        .btn-info-custom:hover { background-color: rgba(109, 109, 110, 0.4); color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-4">
    <a class="navbar-brand" href="#">NETFLIX</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-center navbar-nav me-auto mb-2 mb-lg-0 ms-3">
            <li class="nav-item"><a class="nav-link active" href="/home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">TV Shows</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
            <li class="nav-item"><a class="nav-link" href="/watchlist">My List</a></li>
        </ul>
        <form th:action="@{/search}" method="GET" class="d-flex align-items-center me-3">
            <div class="input-group">
                <input type="text" name="query" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Titles, people, genres...">
                <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
            </div>
        </form>
        <span class="text-white me-2"><i class="bi bi-person-circle fs-4"></i></span>
    </div>
</nav>

<header class="billboard" th:style="'background-image: url(' + ${heroBanner != null ? heroBanner.bannerUrl : 'https://images.unsplash.com/photo-1574267431629-2e5709841c53'} + ');'">
    <div class="billboard-overlay"></div>
    <div class="billboard-content" th:if="${heroBanner != null}">
        <h1 class="billboard-title" th:text="${heroBanner.title}">Featured Movie</h1>
        <p class="billboard-desc" th:text="${heroBanner.description}">Movie Description text placeholder goes here...</p>

        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/watch/{id}(id=${heroBanner.id})}" class="btn btn-play d-flex align-items-center gap-2">
                <i class="bi bi-play-fill fs-4"></i> Play
            </a>

            <form th:action="@{/watchlist/add}" method="POST" class="m-0">
                <input type="hidden" name="movieId" th:value="${heroBanner.id}">
                <button type="submit" class="btn btn-info-custom d-flex align-items-center gap-2">
                    <i class="bi bi-plus-lg fs-5"></i> My List
                </button>
            </form>
        </div>
    </div>
</header>

<main class="container-fluid px-0">
    <div th:each="cat : ${categories}" th:if="${not #lists.isEmpty(cat.movies)}" class="movie-row">
        <h2 class="row-title" th:text="${cat.name}">Category Name</h2>

        <div class="movie-slider">
            <div th:each="movie : ${cat.movies}" class="movie-card">
                <img th:src="${movie.thumbnailUrl}" alt="Movie Thumbnail">

                <div class="movie-card-overlay">
                    <small class="fw-bold text-truncate style-title" style="max-width: 150px;" th:text="${movie.title}">Title</small>
                    <a th:href="@{/watch/{id}(id=${movie.id})}" class="btn btn-sm btn-light rounded-circle p-1 d-flex align-items-center justify-content-center" style="width: 30px; height: 30px;">
                        <i class="bi bi-play-fill text-dark fs-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    window.addEventListener('scroll', function() {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
</script>
</body>
</html>
