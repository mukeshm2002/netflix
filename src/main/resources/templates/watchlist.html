<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - My List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; padding-top: 100px; }
        .navbar { background-color: #141414; }
        .navbar-brand { color: #E50914 !important; font-weight: bold; font-size: 1.8rem; }
        .nav-link { color: #e5e5e5 !important; font-size: 0.9rem; }
        .grid-container { padding: 0 4%; }
        .grid-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 30px; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .movie-card { height: 135px; background-color: #181818; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.3s ease; }
        .movie-card:hover { transform: scale(1.08); z-index: 5; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .movie-card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 10px; opacity: 0; transition: opacity 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .movie-card:hover .movie-card-overlay { opacity: 1; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top px-4">
    <a class="navbar-brand" href="/home">NETFLIX</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
            <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/watchlist">My List</a></li>
        </ul>
    </div>
</nav>

<div class="container-fluid grid-container">
    <h2 class="grid-title">My List</h2>

    <div th:if="${#lists.isEmpty(watchlist)}" class="text-center text-muted my-5 py-5">
        <i class="bi bi-plus-circle fs-1 mb-3 d-block"></i>
        <p class="fs-5">You haven't added any titles to your list yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(watchlist)}" class="results-grid">
        <div th:each="item : ${watchlist}" class="movie-card">
            <img th:src="${item.movie.thumbnailUrl}" alt="Thumbnail">
            <div class="movie-card-overlay">
                <small class="fw-bold text-truncate" style="max-width: 120px;" th:text="${item.movie.title}">Title</small>
                <div class="d-flex gap-2">
                    <a th:href="@{/watch/{id}(id=${item.movie.id})}" class="btn btn-sm btn-light rounded-circle p-1 d-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
                        <i class="bi bi-play-fill text-dark fs-6"></i>
                    </a>
                    <form th:action="@{/watchlist/remove}" method="POST" class="m-0">
                        <input type="hidden" name="movieId" th:value="${item.movie.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle p-1 d-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
                            <i class="bi bi-dash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
