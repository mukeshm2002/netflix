<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Player - Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Video Container */
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* கருப்பு திரை எஃபெக்ட்டிற்காக */
        }

        /* Custom Back Button */
        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-button:hover {
            background: rgba(229, 9, 20, 0.8); /* Netflix Red on Hover */
            color: #fff;
            transform: scale(1.05);
        }

        /* Movie Title Overlay Overlay on Hover */
        .movie-info-overlay {
            position: absolute;
            top: 35px;
            left: 120px;
            z-index: 9;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Quick Overlay controls for controls behavior */
        .likes-section {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="player-container">

    <a href="/home" class="back-button">
        <i class="bi bi-arrow-left"></i>
        <span>Browse</span>
    </a>

    <div class="movie-info-overlay">
        <span th:text="${movie.title}">Movie Title</span>
    </div>

    <video id="netflix-video" controls autoplay th:src="${movie.videoUrl}">
        Your browser does not support the video tag.
    </video>

    <div class="likes-section">
        <i class="bi bi-hand-thumbs-up-fill text-danger fs-5"></i>
        <span class="text-white fw-bold">
                <span th:text="${likesCount}">0</span> Likes
            </span>
    </div>

</div>

<script>
    const video = document.getElementById('netflix-video');

    document.addEventListener('keydown', function(event) {
        // Spacebar -> Play / Pause
        if (event.code === 'Space') {
            event.preventDefault(); // பிராண்ட் ஸ்க்ரோல் ஆவதைத் தடுக்க
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        // Right Arrow -> Skip forward 10 seconds
        if (event.code === 'ArrowRight') {
            video.currentTime += 10;
        }
        // Left Arrow -> Skip backward 10 seconds
        if (event.code === 'ArrowLeft') {
            video.currentTime -= 10;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
