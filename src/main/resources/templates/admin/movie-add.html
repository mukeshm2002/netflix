<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Netflix Admin - Add Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141414; color: #fff; }
        .card { background-color: #181818; border: 1px solid #333; }
        .form-control, .form-select { background-color: #333; color: #fff; border: 1px solid #555; }
        .form-control:focus, .form-select:focus { background-color: #444; color: #fff; box-shadow: none; border-color: #E50914; }
        .btn-netflix { background-color: #E50914; color: white; }
        .btn-netflix:hover { background-color: #b80710; color: white; }
        /* ப்ரோகிரஸ் பாருக்கான அனிமேஷன் ஸ்டைல் */
        .progress { background-color: #333; height: 25px; border-radius: 5px; }
        .progress-bar { background-color: #E50914; font-weight: bold; transition: width 0.1s ease; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h2 class="text-center mb-4" style="color: #E50914; font-weight: bold;">Add New Movie / Series</h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form id="movieForm" th:action="@{/admin/movies/add}" method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Movie Title</label>
                        <input type="text" name="title" class="form-control" required placeholder="Enter movie title">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" required placeholder="Enter movie synopsis..."></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="categoryId" class="form-select" required>
                                <option value="" disabled selected>Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input type="checkbox" name="featured" class="form-check-input" id="featuredCheck" value="true">
                                <label class="form-check-label" for="featuredCheck">Feature on Home Banner (Trending)</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Thumbnail Image (Card Poster)</label>
                        <input type="file" name="imageFile" class="form-control" accept="image/*" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Hero Banner Image (Top Backdrop)</label>
                        <input type="file" name="bannerFile" class="form-control" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Video File (MP4 Movie Stream)</label>
                        <input type="file" name="videoFile" class="form-control" accept="video/*" required>
                    </div>

                    <div id="progressContainer" class="mb-3" style="display: none;">
                        <label class="form-label d-flex justify-content-between">
                            <span id="uploadStatus">Uploading files to Cloudinary...</span>
                            <span id="percentText">0%</span>
                        </label>
                        <div class="progress">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" id="submitBtn" class="btn btn-netflix lg">Upload to Cloudinary & Save</button>
                        <a th:href="@{/admin/movies}" id="cancelBtn" class="btn btn-secondary">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('movieForm').addEventListener('submit', function(e) {
        e.preventDefault(); // ஃபார்ம் சப்மிட் ஆகி பேஜ் ரீஃப்ரெஷ் ஆகுறத தடுக்குறோம்

        const form = e.target;
        const formData = new FormData(form);
        const xhr = new XMLHttpRequest();

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const uploadStatus = document.getElementById('uploadStatus');
        const percentText = document.getElementById('percentText');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // அப்லோட் ஆரம்பிக்கும் போது UI-ஐ மாற்றுகிறோம்
        progressContainer.style.display = 'block';
        submitBtn.disabled = true;
        cancelBtn.classList.add('disabled');
        submitBtn.innerText = "Uploading... Please wait";
        progressBar.style.backgroundColor = '#E50914'; // ரீசெட் ரெட் கலர்

        // ⏳ அப்லோடு அளவைக் கணக்கிடுதல்
        xhr.upload.addEventListener('progress', function(event) {
            if (event.lengthComputable) {
                const percentComplete = Math.round((event.loaded / event.total) * 100);

                // ப்ரோகிரஸ் பாரை அப்டேட் செய்கிறோம்
                progressBar.style.width = percentComplete + '%';
                progressBar.innerText = percentComplete + '%';
                percentText.innerText = percentComplete + '%';

                if (percentComplete === 100) {
                    uploadStatus.innerText = "Files upload complete! Processing & Saving in Database...";
                    progressBar.classList.remove('progress-bar-animated'); // அனிமேஷனை நிறுத்துகிறோம்
                } else {
                    uploadStatus.innerText = "Uploading movie components (" + percentComplete + "%)...";
                }
            }
        });

        // 🌟 அப்டேட்: அசல் சர்வர் பிழையை அப்படியே அலர்ட் பாப்-அப் ஆகக் காட்டும் லாஜிக்
        xhr.onreadystatechange = function() {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                if (xhr.status >= 200 && xhr.status < 300) {

                    // சக்ஸஸ் ரெஸ்பான்ஸ் வந்தாலும் உள்ளே Thymeleaf எர்ரர் மெசேஜ் ஏதும் ஒளிந்திருக்கிறதா என்று பார்க்கிறோம்
                    if (xhr.responseText.includes("alert-danger") || xhr.responseText.includes("Cloudinary Upload Failed")) {
                        alert("Thymeleaf Form Error Detected! Check inputs.");
                        uploadStatus.innerText = "Cloudinary Upload Failed! Check credentials.";
                        progressBar.style.backgroundColor = '#ff0000';
                        submitBtn.disabled = false;
                        cancelBtn.classList.remove('disabled');
                        submitBtn.innerText = "Upload to Cloudinary & Save";
                    } else {
                        // எல்லாம் பக்காவா முடிந்தால் ரீடைரெக்ட்
                        uploadStatus.innerText = "Success! Redirecting...";
                        window.location.href = "/admin/movies?success=Movie+Added+Successfully";
                    }

                } else {
                    // 🚨 500 அல்லது மற்ற எர்ரர்கள் வந்தால் சர்வர் அனுப்பிய உண்மையான டெக்ஸ்ட்டை அலர்ட்டில் காட்டுகிறோம்!
                    alert("Real Server Error (Status " + xhr.status + "):\n\n" + xhr.responseText.substring(0, 400));

                    uploadStatus.innerText = "Check the popup error message details!";
                    progressBar.style.backgroundColor = '#ff0000';
                    submitBtn.disabled = false;
                    cancelBtn.classList.remove('disabled');
                    submitBtn.innerText = "Upload to Cloudinary & Save";
                }
            }
        };

        // நெட்வொர்க் எர்ரர் ஏற்பட்டால்
        xhr.addEventListener('error', function() {
            uploadStatus.innerText = "Network Error! Please check your connection.";
            progressBar.style.backgroundColor = '#ff0000';
            submitBtn.disabled = false;
            cancelBtn.classList.remove('disabled');
            submitBtn.innerText = "Upload to Cloudinary & Save";
        });

        // ரெண்டர் சர்வர் URL-க்கு டேட்டாவை அனுப்புகிறோம்
        xhr.open('POST', form.action);
        xhr.send(formData);
    });
</script>

</body>
</html>
